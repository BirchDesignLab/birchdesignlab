# About page copy. Etymology paragraphs may use *emphasis* and **strong**.
page: about
title: About · Birch Design Lab
description: Where the name comes from, and the one person behind Birch Design Lab.
heading: The shining tree
etymology:
  - >-
    *Birch*: Old English *beorc*, from the root meaning **to shine**. The same
    syllable survives in *bright*. The birch is literally "the shining tree,"
    named for the way its white bark stands out amongst the dark woods, where
    you can see it from a long way off.
  - >-
    The word is old enough to have kept its own letter. When English was still
    Olde and written in runes, the rune for B was *beorc*, the birch rune. The
    tree was so familiar that it stood for a sound. As business names go, this
    one had a few thousand years' head start.
founder:
  heading: The founder
  body:
    - >-
      Birch Design Lab is one man. Like the tree, he is tall and pale.
    - >-
      He has spent over a decade building enterprise software, and he lives on
      the Gulf Coast, a stretch of country the birch has no business surviving
      in. He started Birch Design Lab to put that knowledge to work for local
      business owners, and to drag the businesses here into the 21st century,
      kicking and screaming if he has to.
    - >-
      There is no plan to grow into a team. The person who scopes your project
      also writes the code and answers your email two months later when
      something needs to change. With no office and no staff to pay for, the
      price comes in well under what a firm charges. Everything built for you
      is yours to keep, and another developer could pick it up if it ever came
      to that.
manifesto: >-
  Designed, constructed, and cared for.
cta: Let's get started
