# About page copy. Etymology paragraphs may use *emphasis* and **strong**.
page: about
title: About · Birch Design Lab
description: The name, the oldest paper of the north, and the man behind Birch Design Lab.
heading: The shining tree
etymology:
  - >-
    *Birch*: Old English *beorc*, from the root meaning **to shine**. The same
    syllable survives in *bright*. The birch is literally "the shining tree,"
    named for the way its white bark stands out amongst the dark woods. Visible
    from a distance.
  - >-
    The word is old enough to have kept its own letter. When English was still
    Olde and written in runes, the rune for B was *beorc*: the birch rune. A
    tree so familiar it stood for a sound. Most business names get invented in
    an afternoon. This one has been standing for a few thousand years.
founder:
  heading: The founder
  body:
    - >-
      Birch Design Lab is one man much like the birch tree. Tall, pale, and
      shining amongst the darkness.
    - >-
      That's not a placeholder for "growing into a team." It's the entire
      model. The same hands that scope your project write the code and test it
      on phones, tablets, and desktop. Then answer your email two months later
      when something needs to change. No account manager, no handoffs, no "let
      me loop in the team."
    - >-
      Over a decade spent designing and building things on the Gulf Coast, a
      stretch of country the birch has no business surviving in. What that
      decade taught him is the best work holds up when it's built with
      consideration for the people who will use it. Not to impress for a
      season and get left out in the weather.
manifesto: >-
  Everything here is one person's work. That is not a limitation, it is the
  guarantee.
cta: Let's get started
