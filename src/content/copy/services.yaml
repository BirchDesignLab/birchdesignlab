# Services page copy.
page: services
title: Custom software and web design for Gulf Coast businesses
description: >-
  Custom software and web design for businesses across the Mississippi Gulf
  Coast, designed, constructed, and cared for by one accountable craftsman.
kicker: Services
heading: Two things, done properly.
sublines:
  - >-
    We've spent a decade building software for big companies. Local
    businesses get the same standard of work.
  - >-
    You see the real build from the start, and what we build is yours to
    keep.
offerings:
  - heading: Custom software
    body:
      - >-
        The client list is split across three phones, the schedule comes from
        a paper calendar and a gut feeling, and orders get tracked in a group
        text until someone loses one. If any of that sounds familiar, it's the
        kind of thing we fix.
      - >-
        We build one small, sturdy tool to replace whichever is costing you
        the most time, usually something you open in a browser on your phone
        or computer. We can stay on afterwards to keep it running and add to
        it.
  - heading: Web design
    body:
      - >-
        Your customers are choosing where to eat tonight, booking a charter,
        or comparing venues, and your website is what they have to go on.
      - >-
        Ours read clearly on a phone and put the next step, whether that's
        calling, booking, or ordering, one tap away.
      - >-
        You can update the menu yourself in a few minutes, with no PDF to
        re-upload. Booking can run on your own site if you'd rather not send
        customers to a third-party app.
process:
  heading: How a project runs
  steps:
    - title: Discovery
      body: >-
        We start by talking through what you need. Afterwards you get a
        written scope, short enough to read in one sitting.
    - title: Build
      body: >-
        You get a working link at the start of the project. It opens the real
        build, so you can click through it as it takes shape and send feedback
        as you go.
    - title: Launch
      body: >-
        We test it on phones, tablets, and desktops, then hand it over with an
        owner's manual and a bow. Stay with us afterwards, or take everything
        we built to anyone you like.
    - title: Care
      body: >-
        We offer ongoing care that keeps it secure and up to date. If you'd
        rather not, everything we built is still yours.
pull: Every project starts with a normal conversation.
cta: Tell us about your project
