# Services page copy.
page: services
title: Custom software and web design for Gulf Coast businesses
description: >-
  Custom software and web design for businesses across the Mississippi Gulf
  Coast, designed, constructed, and cared for by one accountable craftsman.
kicker: Services
heading: Two things, done properly.
sublines:
  - >-
    A decade of skills honed at the enterprise level, now served to the
    businesses that keep the Gulf Coast running.
  - >-
    Same person designs it, builds it, and answers when you call. That's the
    whole model, twice.
offerings:
  - heading: Custom software
    body:
      - >-
        Every business runs on a few things that never made it into any
        official system: the client list split across three phones, the
        schedule you're building from a paper calendar and a gut feeling, the
        order that gets tracked in a group text until someone loses it.
      - >-
        We build the small, sturdy tool that replaces whichever one is costing
        you the most time. We can stay around to keep it running as the
        business grows past it.
  - heading: Web design
    body:
      - >-
        Your website is the first impression most customers will ever get.
        Whether that's deciding where to eat tonight, booking a charter, or
        comparing venues.
      - >-
        Ours load fast, read clearly on any device, and are built around one
        question. What should they do next; call, book, order, walk in?
      - >-
        Menus that update in minutes, not PDFs. Booking that keeps the
        reservation with you instead of a third-party app. Every site is
        designed and constructed by the same two hands, for the business it
        belongs to.
process:
  heading: How a project runs
  steps:
    - title: Discovery
      body: >-
        We have a conversation. No questionnaire, no intake form, no workshop
        with a slide deck. We leave with a project scope you can actually read,
        not a sales pitch.
    - title: Build
      body: >-
        You get a working link at the beginning of the project. Access to the
        real build you can click through, not a mockup. Watch it evolve and
        fold in feedback throughout. No surprise reveal at the end.
    - title: Launch
      body: >-
        Tested on multiple devices. Delivered with an owner's manual and a bow.
        Stay with us, or take the tools we built you anywhere you like
        afterwards.
    - title: Care
      body: >-
        Software is a living thing. We offer ongoing care so it stays fast,
        secure, and current as your business grows. It's yours either way.
pull: Every project starts with a normal conversation.
cta: Tell us about your project
