# Services page copy.
page: services
title: Custom software and web design for Gulf Coast businesses
description: >-
  Custom software and web design for businesses across the Mississippi Gulf
  Coast, designed, constructed, and cared for by one accountable craftsman.
kicker: Services
heading: Two things, done properly.
sublines:
  - >-
    After a decade of enterprise software, we now work for the businesses that
    keep the Gulf Coast running.
  - >-
    The same person designs it, builds it, and answers when you call,
    whichever of the two you need.
offerings:
  - heading: Custom software
    body:
      - >-
        Every business runs on a few things that never made it into any
        official system: the client list split across three phones, the
        schedule you're building from a paper calendar and a gut feeling, the
        order that gets tracked in a group text until someone loses it.
      - >-
        We build the small, sturdy tool that replaces whichever one is costing
        you the most time. Then we can stay on to keep it running and add to
        it as the business grows.
  - heading: Web design
    body:
      - >-
        Most customers see your website before they see you. They're choosing
        where to eat tonight, booking a charter, or comparing venues, and the
        site is what they go on.
      - >-
        Ours load fast and read clearly on a phone. Each is built around what
        the visitor should do next: call, book, order, or walk in.
      - >-
        You can update the menu yourself in a few minutes, with no PDF to
        re-upload. Bookings come to you instead of going through a third-party
        app. Every site is designed and constructed by hand for the business
        it belongs to.
process:
  heading: How a project runs
  steps:
    - title: Discovery
      body: >-
        We start with a conversation and skip the questionnaire and the
        slide-deck workshop. Afterwards you get a scope in plain English,
        short enough to read in one sitting.
    - title: Build
      body: >-
        You get a working link at the start of the project. It opens the real
        build, so you can click through it as it takes shape and send feedback
        as you go. Nothing waits for a big reveal at the end.
    - title: Launch
      body: >-
        We test it on phones, tablets, and desktops, then hand it over with an
        owner's manual and a bow. Stay with us afterwards, or take it anywhere
        you like.
    - title: Care
      body: >-
        Software needs upkeep like anything else. We offer ongoing care that
        keeps yours secure and up to date as the business changes. It's yours
        either way.
pull: Every project starts with a normal conversation.
cta: Tell us about your project
