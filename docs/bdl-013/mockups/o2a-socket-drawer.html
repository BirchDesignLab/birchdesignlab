<!doctype html>
<html lang="en" data-scheme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Under one page</title>
<script>try{document.documentElement.setAttribute('data-scheme',matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Marcellus&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* Night */
  --field:#1c1a17; --raised:#272319; --green-field:#22322a; --green-surface:#2b3a31;
  --mark:#f4f0e6; --muted:#a89f8f; --accent:#a3bd8f; --accent-strong:#bf9468; --billboard:#6f9678;
  --link:#a3bd8f; --line:rgba(244,240,230,.18); --grid:rgba(244,240,230,.045);
  --site-bg:#f7f3ea; --site-ink:#1d2d25; --site-line:#e6dfd0;
  --ease:cubic-bezier(0.22,1,0.36,1);
  --nrx:0deg; --nrz:0deg; --lk:0; --bbf:12.6px;
}
html[data-scheme="light"]{
  --field:#f5f1e8; --raised:#e9e1d2; --green-field:#2b4a37; --green-surface:#e3e9e0;
  --mark:#1f1b15; --muted:#5a5244; --accent:#2b4a37; --accent-strong:#4a3a2c; --billboard:#2b4a37;
  --link:#2f6644; --line:rgba(31,27,21,.2); --grid:rgba(31,27,21,.10);
}
*{box-sizing:border-box;border-radius:0}
html{background:var(--field)}
body{margin:0;background:var(--field);color:var(--mark);font-family:'Spectral',Georgia,serif;overflow-x:hidden}
body.desk{height:100vh;overflow:hidden}
button{font:inherit;cursor:pointer;border-radius:0}

#fix{position:fixed;inset:0;overflow:hidden;background:var(--field)}
html:not([data-scheme="light"]) #fix{background:
  radial-gradient(ellipse 55% 70% at 30% 56%, rgba(34,50,42,.95) 0%, rgba(34,50,42,0) 72%),
  radial-gradient(ellipse 40% 50% at 85% 10%, rgba(191,148,104,.07) 0%, rgba(191,148,104,0) 70%), var(--field)}
#fix::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:72px 72px}
#motes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
html[data-scheme="light"] #motes{display:none}
#design{position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:0 0}

/* head + controls */
.head{position:absolute;left:64px;top:46px;width:760px;z-index:6;pointer-events:none}
.head h1{margin:0;font:400 54px/1.04 'Marcellus',Georgia,serif;color:var(--mark);animation:rise 1.2s var(--ease) .1s both}
.head p{margin:12px 0 0;font:italic 400 20px/1.3 'Spectral',Georgia,serif;color:var(--muted);max-width:640px;animation:rise 1.2s var(--ease) .3s both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ctrl{position:absolute;right:64px;top:44px;display:flex;gap:12px;align-items:center;z-index:7}
.btn,.seg button{font:500 12px 'IBM Plex Mono',monospace;letter-spacing:.04em;color:var(--mark);background:transparent;border:1px solid var(--line);padding:9px 14px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.seg{display:flex;border:1px solid var(--line)}
.seg button{border:0;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--field)}
html[data-scheme="light"] .seg button[aria-pressed="true"]{color:var(--field)}

/* scene */
#scene{position:absolute;inset:0;perspective:2400px;z-index:2}
#stack{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.plane,.tray{position:absolute;transform-style:preserve-3d}
.plane{left:-240px;top:-115px;width:480px;height:230px;--glow:0;cursor:default}
.face{position:absolute;inset:0;overflow:hidden}
html:not([data-scheme="light"]) .face{
  background:linear-gradient(145deg,color-mix(in srgb,var(--green-surface) 90%,transparent),color-mix(in srgb,var(--raised) 92%,transparent));
  border:1px solid color-mix(in srgb,var(--accent) calc((26 + var(--glow)*64) * 1%),transparent);
  box-shadow:inset 0 0 40px color-mix(in srgb,var(--accent) calc((4 + var(--glow)*22) * 1%),transparent),0 0 calc(var(--glow)*48px) color-mix(in srgb,var(--accent) calc(var(--glow)*58 * 1%),transparent)}
html[data-scheme="light"] .face{background:var(--raised);border:1px solid var(--mark);box-shadow:7px 7px 0 color-mix(in srgb,var(--mark) 12%,transparent)}
html[data-scheme="light"] .face::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;border-top:3px solid var(--accent);border-bottom:4px solid var(--accent);opacity:var(--glow);pointer-events:none;z-index:7}
.face::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.face .wash{position:absolute;inset:0;background:var(--field);opacity:var(--wash,0);z-index:6;pointer-events:none}

/* billboards: text counter-rotated to read flat */
.bb{position:absolute;translate:-50% -50%;white-space:nowrap;text-align:center;pointer-events:none;
  transform:translateZ(calc(var(--lk) * var(--lift,12) * 1px)) rotateZ(var(--nrz)) rotateX(var(--nrx));
  font:500 var(--bbf)/1.25 'IBM Plex Mono',monospace;color:var(--mark)}
.bb.l{translate:0 -50%;text-align:left}
.bb.sp{font-family:'Spectral',serif;font-weight:400}
.bb.nm{font:400 calc(var(--bbf) + 3px)/1.1 'Marcellus',Georgia,serif}
.bb.wrap{white-space:normal}
.bb.card{text-align:left;display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);padding:7px 11px;background:color-mix(in srgb,var(--field) 84%,transparent)}
html[data-scheme="light"] .bb.card{background:var(--field);border-color:var(--mark)}
.ln{transition:color .3s;color:var(--muted);min-height:1.25em}
.ln.on{color:var(--accent)}
html:not([data-scheme="light"]) .bb.card.hot{border-color:var(--accent);box-shadow:0 0 20px color-mix(in srgb,var(--accent) 50%,transparent)}
html[data-scheme="light"] .bb.card.hot{background:var(--accent);border-color:var(--mark)}
html[data-scheme="light"] .bb.card.hot .ln{color:var(--field)}
.bb.card.hot .ln.on{color:var(--mark)}
html[data-scheme="light"] .bb.card.hot .ln.on{color:var(--field)}
.ln.tag{width:100%;font-weight:500;letter-spacing:.06em;color:var(--muted)}
.bb.card.ho{background:none;border:0;padding:0}
.bb.cl{white-space:normal;display:flex;flex-direction:column;align-items:center;gap:5px;max-width:132px}
.bb.cl .chip{line-height:1.15;text-align:center}
.bb.cl .nm{font:400 calc(var(--bbf) + 3px)/1.1 Marcellus,Georgia,serif;white-space:normal}
.bb.cloud{flex-direction:row;flex-wrap:wrap;gap:5px 12px;align-items:center}
.bb.cloud .ln{white-space:nowrap}
.hx{display:none;color:var(--muted);font-size:calc(var(--bbf) - 1.5px);line-height:1.2}
body.hood .hx{display:block}
.bb.mu{color:var(--muted)}
.ho{transition:opacity .5s var(--ease)}
body:not(.hood) .ho{opacity:0!important}

.chip{display:inline-block;border:1px solid var(--accent);color:var(--accent);padding:2px 7px;font:500 var(--bbf)/1.25 'Spectral',serif;letter-spacing:.01em}
.bb.chip{padding:2px 7px}
.chip.res,.bb.chip.res{color:var(--accent-strong);border-color:var(--accent-strong);background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--accent-strong) 12%,transparent) 0 1px,transparent 1px 6px)}
.chip.idea,.bb.chip.idea{color:color-mix(in srgb,var(--muted) 45%,transparent);border:1px dashed var(--line);background:none}
html[data-scheme="light"] .chip.idea,html[data-scheme="light"] .bb.chip.idea{color:color-mix(in srgb,var(--muted) 62%,transparent)}
.mono{font-family:'IBM Plex Mono',monospace}

/* page plane */
.p1 .face{background:var(--site-bg)!important}
.mini{position:absolute;inset:0}
.nav{position:absolute;left:0;right:0;top:0;height:36px;background:#fff;border-bottom:1px solid var(--site-line);display:flex;align-items:center;gap:12px;padding:0 16px}
.nav i{display:block;height:5px;background:#cdc6b6;width:38px}
.nav i:first-child{width:96px;height:7px;background:#1f2f27;margin-right:auto}
.hero{position:absolute;left:0;right:0;top:36px;bottom:0;background:linear-gradient(160deg,#97b08a 0%,#c8d9bd 52%,#edf1e2 100%);padding:24px 28px}
.hero h4{margin:0;font:400 29px/1.07 'Marcellus',Georgia,serif;color:var(--site-ink);width:255px}
.hero p{margin:9px 0 0;font:400 12.5px/1.4 'Spectral',serif;color:#33443a;width:230px}
.hero .cta{display:inline-block;margin-top:14px;background:#b8532f;color:#fff;font:500 12px 'Spectral',serif;padding:8px 16px;box-shadow:0 2px 0 #8e3d20}
.plate{position:absolute;right:36px;top:34px;width:122px;height:122px;border-radius:50%!important;background:radial-gradient(circle at 50% 50%,#c97a3f 0 20%,#e3b57a 21% 38%,#f4efe2 39% 62%,#fff 63% 100%);box-shadow:0 10px 24px rgba(31,47,39,.25)}
.sprig{position:absolute;right:18px;bottom:14px;width:96px;height:30px;background:linear-gradient(135deg,#6f9678 0 50%,#5c8566 50%);clip-path:polygon(0 100%,16% 20%,30% 80%,48% 10%,64% 80%,82% 20%,100% 100%);opacity:.7}

/* languages */
.lrow{position:absolute;left:20px;right:20px;height:72px;border:1px solid var(--line);background:color-mix(in srgb,var(--mark) 3.5%,transparent);padding:10px 16px 10px 96px}
.lrow s{display:block;height:6px;margin-top:11px;background:color-mix(in srgb,var(--mark) 16%,transparent);text-decoration:none;width:62%}
.lrow s+s{width:44%;background:color-mix(in srgb,var(--mark) 10%,transparent)}
.lrow s:first-of-type{margin-top:8px}

/* headers */
.shield{position:absolute;left:14px;top:60px;width:96px;height:160px}
.shield *{vector-effect:non-scaling-stroke}
.hdr{border:1px solid var(--line);padding:3px 9px;color:var(--muted);transition:color .3s,border-color .3s,background .3s}
.hdr.on{color:var(--accent);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
html[data-scheme="light"] .hdr.on{color:var(--field);background:var(--accent)}

/* build chassis + drawer */
.rail{position:absolute;left:12px;right:12px;top:120px;height:0;border-top:2px solid color-mix(in srgb,var(--accent) 55%,transparent)}
.cav{position:absolute;left:12px;top:12px;right:12px;bottom:12px;border:1px dashed var(--line)}
.tray{left:0;top:0;width:596px;height:300px}
html:not([data-scheme="light"]) .tray .face{border-color:color-mix(in srgb,var(--accent) 70%,transparent)!important;box-shadow:0 18px 40px rgba(0,0,0,.5),0 0 22px color-mix(in srgb,var(--accent) 22%,transparent)!important}
html:not([data-scheme="light"]) .tray .face{background:linear-gradient(145deg,color-mix(in srgb,var(--green-field) 94%,transparent),color-mix(in srgb,var(--raised) 95%,transparent))}
.cell{position:absolute;--f:0;transform:translateZ(calc(var(--lk) * 3px))}
.cell.built{border:1px solid var(--accent)}
html:not([data-scheme="light"]) .cell.built{background:color-mix(in srgb,var(--accent) calc((26 + var(--f)*30) * 1%),transparent);box-shadow:0 0 calc(6px + var(--f)*34px) color-mix(in srgb,var(--accent) calc((22 + var(--f)*60) * 1%),transparent),inset 0 0 18px color-mix(in srgb,var(--accent) calc((6 + var(--f)*20) * 1%),transparent)}
html[data-scheme="light"] .cell.built{background:var(--green-surface);border-color:var(--mark);box-shadow:4px 4px 0 color-mix(in srgb,var(--mark) 12%,transparent),inset 0 calc(var(--f) * 4px) 0 var(--accent)}
.cell.res{border:1px solid var(--accent-strong);background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--accent-strong) 12%,transparent) 0 1px,transparent 1px 7px)}
.cell.idea{border:1px dashed var(--line);background:none}
.cell.gone{border-color:transparent;background:none;box-shadow:none}
.cell.in-gone{display:none}
.stem{position:absolute;width:0;height:calc(var(--lk) * var(--sh,20) * 1px);border-left:1px solid color-mix(in srgb,var(--muted) 70%,transparent);transform-origin:0 0;transform:rotateX(90deg);pointer-events:none}
.pipe{position:absolute;border:1px solid var(--accent-strong);background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--accent-strong) 12%,transparent) 0 1px,transparent 1px 6px);transform:translateZ(calc(var(--lk) * 3px))}
.tg{position:absolute;width:36px;height:16px;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) calc((10 + var(--sw,1)*22) * 1%),transparent);transform:translateZ(calc(var(--lk) * 3px));--sw:1}
.tg i{position:absolute;top:2px;left:calc(2px + var(--sw) * 18px);width:12px;height:10px;background:var(--accent)}
.tg.off{border-color:var(--muted)}
.tg.off i{background:var(--muted)}
.form{position:absolute;left:14px;top:274px;width:300px;height:120px;border:1px dashed var(--accent-strong);transform:translateZ(calc(var(--lk) * 3px))}
.frow{position:absolute;height:18px;border:1px solid var(--line)}
.wst{color:var(--muted);transition:color .3s}
.wst.on{color:var(--accent)}
.led{display:inline-block;width:8px;height:8px;border-radius:50%!important;background:var(--muted);margin-right:7px;vertical-align:1px}
.wst.on .led{background:var(--accent)}
html:not([data-scheme="light"]) .wst.on .led{box-shadow:0 0 10px var(--accent)}

/* worker */
.hex{position:absolute;left:408px;top:120px;width:56px;height:64px;opacity:calc(.55 + var(--glow)*.45)}
.rt{border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);padding:3px 9px;color:var(--muted);transition:color .3s,border-color .3s}
.rt.on,.lit{color:var(--accent);border-color:var(--accent)}
html[data-scheme="light"] .rt.on,html[data-scheme="light"] .lit{color:var(--field);background:var(--accent)}
.gate{border:1px solid var(--accent);color:var(--accent);padding:3px 9px}
html[data-scheme="light"] .gate{background:var(--green-surface);color:var(--accent);border-color:var(--accent)}
.fl{border:1px solid var(--line);padding:3px 9px;color:var(--muted);transition:color .3s,border-color .3s}
.fl.on{color:var(--accent);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
html[data-scheme="light"] .fl.on{color:var(--field);background:var(--accent)}
.dots{position:absolute;inset:0;background-image:radial-gradient(color-mix(in srgb,var(--accent) 34%,transparent) 1px,transparent 1.3px);background-size:14px 14px}
.stamp{color:var(--muted);letter-spacing:.06em}

/* request chip */
.req{position:absolute;left:0;top:0;white-space:nowrap;font:500 12.5px/1.2 'IBM Plex Mono',monospace;padding:5px 10px;border:1px solid var(--accent);color:var(--mark);pointer-events:none;translate:-50% -50%;z-index:9;opacity:0}
html:not([data-scheme="light"]) .req{background:color-mix(in srgb,var(--field) 80%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 70%,transparent),inset 0 0 8px color-mix(in srgb,var(--accent) 30%,transparent);color:var(--accent)}
html[data-scheme="light"] .req{background:var(--mark);color:var(--field);outline:2px solid var(--accent);outline-offset:1px;border-color:var(--mark)}
.rod{position:absolute;left:0;top:0;width:0;height:100px;border-left:1px dashed color-mix(in srgb,var(--accent) 45%,transparent);transform-origin:0 0;pointer-events:none}

/* overlay: leaders, links, hud, cursor */
#over{position:fixed;inset:0;z-index:8;pointer-events:none;overflow:visible}
#leaders{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#leaders path{fill:none;stroke-linecap:round;stroke-linejoin:round}
#leaders .ld{stroke:color-mix(in srgb,var(--accent) 60%,transparent);stroke-width:1}
#leaders .on .ld{stroke:var(--accent);stroke-width:1.6}
#leaders circle.ar{fill:var(--field);stroke:var(--accent);stroke-width:1.2}
#leaders .tk{stroke:var(--mark);stroke-width:1.2;opacity:.7;display:none}
html[data-scheme="light"] #leaders .tk{display:block}
html[data-scheme="light"] #leaders circle.ar{display:none}
html[data-scheme="light"] #leaders .ld{stroke:color-mix(in srgb,var(--mark) 55%,transparent);stroke-width:.9}
#links path{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 4;opacity:0}
#links path.rodl{stroke-width:1;stroke-dasharray:2 5;stroke:var(--muted)}
html[data-scheme="light"] #links path{stroke:var(--mark)}
#navhud{position:absolute;left:0;top:0;white-space:nowrap;display:flex;align-items:center;gap:calc(var(--hf,12px)*.5);background:var(--site-bg);color:var(--site-ink);border:1px solid var(--site-line);padding:calc(var(--hf,12px)*.55) calc(var(--hf,12px)*1.2);font:400 var(--hf,12px)/1 'Spectral',serif;translate:-50% -50%;opacity:0;box-shadow:0 8px 20px rgba(0,0,0,.18)}
html[data-scheme="light"] #navhud{box-shadow:5px 5px 0 color-mix(in srgb,var(--mark) 14%,transparent);border-color:var(--mark)}
#navhud b{font:400 calc(var(--hf,12px)*1.15)/1 'Marcellus',serif;margin-right:calc(var(--hf,12px)*1.2)}
#navhud span{padding:calc(var(--hf,12px)*.25) calc(var(--hf,12px)*.45);border:1px solid transparent}
#navhud span.tap{background:var(--site-ink);color:var(--site-bg)}
#navhud em{font:500 calc(var(--hf,12px)*.92)/1 'IBM Plex Mono',monospace;font-style:normal;border:1px solid #bdb5a2;padding:calc(var(--hf,12px)*.3) calc(var(--hf,12px)*.5)}
#cursor{position:absolute;left:0;top:0;width:22px;height:26px;opacity:0}
#cursor i{position:absolute;inset:0;background:var(--mark);clip-path:polygon(0 0,0 80%,22% 62%,38% 100%,52% 94%,36% 58%,66% 58%);outline:none}
html[data-scheme="light"] #cursor i{background:var(--mark)}
#cursor u{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border:2px solid var(--accent);border-radius:50%!important;opacity:0;text-decoration:none}

/* labels column */
.labels{position:absolute;left:1050px;top:132px;width:336px;z-index:6;display:flex;flex-direction:column;gap:11px}
.lab{position:relative;padding-left:44px;opacity:0;cursor:default;min-height:48px}
.lab .dot{position:absolute;left:0;top:7px;width:10px;height:10px;border:1.5px solid var(--accent);background:var(--field);transition:background .3s}
.lab.on .dot,.lab:hover .dot{background:var(--accent)}
.lab .num{position:absolute;left:19px;top:5px;font:500 11px 'IBM Plex Mono',monospace;color:var(--accent);letter-spacing:.08em}
.lab .tx{font:400 18px/1.22 'Marcellus',Georgia,serif;color:var(--mark)}
.lab.on .tx{color:var(--accent)}
body.hood .lab .tx{font:400 11.5px/1.45 'IBM Plex Mono',monospace;letter-spacing:-.01em;color:var(--mark);white-space:pre-line;word-break:break-word}
body.hood .lab.on .tx{color:var(--accent)}
#slotcard{position:absolute;left:1050px;top:690px;width:336px;min-height:122px;padding:13px 16px;z-index:6;border:1px solid var(--line);background:color-mix(in srgb,var(--raised) 70%,transparent);opacity:0}
#slotcard .h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#slotcard .h b{font:400 19px 'Marcellus',serif}
#slotcard .tx{font:400 14.5px/1.38 'Spectral',serif;color:var(--muted)}
body.hood #slotcard .tx{font:400 11.5px/1.45 'IBM Plex Mono',monospace;color:var(--mark)}
#cap{position:absolute;left:64px;top:812px;width:900px;z-index:6;opacity:0;pointer-events:none}
#cap b{display:block;font:400 28px/1.15 'Marcellus',Georgia,serif}
#cap span{display:block;margin-top:6px;font:400 12px/1.4 'IBM Plex Mono',monospace;color:var(--muted)}
.legend{position:absolute;left:64px;top:852px;display:flex;gap:22px;align-items:center;z-index:6;font:400 12px 'IBM Plex Mono',monospace;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{display:block;width:20px;height:13px}
.legend .s-b{border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 28%,transparent)}
html[data-scheme="light"] .legend .s-b{background:var(--green-surface);border-color:var(--mark)}
.legend .s-r{border:1px solid var(--accent-strong);background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--accent-strong) 12%,transparent) 0 1px,transparent 1px 6px)}
.legend .s-i{border:1px dashed var(--line)}
#mlist,#mnav{display:none}

/* mobile: normal flow, stack 420px */
body.mobile{height:auto;overflow-y:auto;overflow-x:hidden}
body.mobile #fix{position:relative;inset:auto;overflow:visible;min-height:100vh;background:var(--field)}
body.mobile #motes{position:fixed}
body.mobile #design{position:relative;width:390px;height:auto;transform:none!important;display:flex;flex-direction:column;padding:0 16px 40px;margin:0 auto;left:auto;top:auto}
body.mobile .head,body.mobile .ctrl,body.mobile .legend,body.mobile #cap,body.mobile .labels,body.mobile #slotcard{position:relative;left:auto;top:auto;right:auto;width:auto}
body.mobile .head{order:1;padding-top:22px}
body.mobile .head h1{font-size:32px}

.mi.idea .n{color:color-mix(in srgb,var(--muted) 55%,transparent)}

.mi.gone .n,.mi.gone .chip{display:none}

<body class="desk">
<div id="fix">
  <canvas id="motes"></canvas>
  <div id="design">
    <div class="head">
      <h1>Under one page.</h1>
      <p id="sub" data-p="What a visitor sees, what runs underneath, and where new parts plug in." data-h="One page, its layers, and the manifests that fill them."></p>
    </div>
    <div class="ctrl">
      <button id="replay" class="btn" type="button">Replay</button>
      <div class="seg" role="group" aria-label="Label style">
        <button type="button" data-m="plain" aria-pressed="true">Plain English</button>
        <button type="button" data-m="hood" aria-pressed="false">Under the hood</button>
      </div>
      <div class="seg" role="group" aria-label="Face">
        <button type="button" data-s="light" aria-pressed="false">Day</button>
        <button type="button" data-s="dark" aria-pressed="false">Night</button>
      </div>
    </div>

    <div id="scene"><div id="stack"></div></div>
    <div id="mnav"></div>
    <div class="labels" id="labels"></div>
    <div id="slotcard"></div>
    <div id="mlist"></div>
    <div id="cap"><b></b><span></span></div>
    <div class="legend"><span><i class="s-b"></i>built</span><span><i class="s-r"></i>designed, or slot reserved</span><span><i class="s-i"></i>idea, not built</span></div>
  </div>
  <div id="over">
    <svg id="leaders" aria-hidden="true"><g id="lds"></g><g id="links"></g></svg>
    <div id="navhud"></div>
    <div id="cursor"><i></i><u data-round></u></div>
  </div>
</div>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  function bez(x1, y1, x2, y2) {
    return x => {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 10; i++) {
        const c = 3*x1*t*(1-t)*(1-t) + 3*x2*t*t*(1-t) + t*t*t - x;
        const d = 3*x1*(1-t)*(1-t) + 6*(x2-x1)*t*(1-t) + 3*(1-x2)*t*t;

  const easeP = bez(0.5, 0, 0.2, 1), easeOut = bez(0.22, 1, 0.36, 1), easeIO = bez(0.65, 0, 0.35, 1), easeS = bez(0.3, 0, 0.2, 1);

  const html = document.documentElement;

  const cells = {};

  Object.defineProperty(window, '__copy', {
    get() {
      const out = [];
      const w = document.createTreeWalker($('#fix'), NodeFilter.SHOW_TEXT);
      let n;
      while ((n = w.nextNode())) {
        const s = n.nodeValue.trim();
        if (!s || n.parentNode.closest('script,style')) continue;
        out.push(s);
      }
      return out;
    }
  });
})();
</script>
